<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageCapture Test Pages</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #edf0f2; color: #192224; font: 16px system-ui, sans-serif; }
    main { width: min(100% - 32px, 900px); margin: 24px auto; }
    header, footer { display: flex; gap: 16px; align-items: center; justify-content: space-between; }
    h1 { font-size: 20px; margin: 0; }
    #page { margin: 20px 0; aspect-ratio: 3 / 2; background: white; border: 1px solid #c6cdd0; padding: 7%; overflow: hidden; }
    #page h2 { font-size: 30px; margin: 0 0 20px; }
    #number { font-size: 72px; font-weight: 700; line-height: 1; }
    #graphic { display: flex; align-items: end; gap: 10%; height: 42%; margin-top: 30px; }
    #graphic span { width: 22%; background: #177f77; }
    #graphic span:nth-child(2) { background: #e26966; }
    #graphic span:nth-child(3) { background: #e7bc40; }
    #footer-label { color: #5b6569; }
    button { width: 56px; height: 44px; border: 1px solid #aeb9bd; border-radius: 6px; background: white; cursor: pointer; color: #192224; font-size: 24px; }
    button:hover { background: #def4ef; }
    button:focus-visible { outline: 3px solid #177f77; outline-offset: 2px; }
    nav { display: flex; gap: 12px; }
    @media (max-width: 600px) { #page h2 { font-size: 20px; } #number { font-size: 48px; } #graphic { margin-top: 14px; } }
  </style>
</head>
<body>
  <main>
    <header><h1>PageCapture Test Pages</h1><output id="counter" aria-live="polite">1 / 4</output></header>
    <section id="page"><h2 id="title">First Page</h2><div id="number">01</div><div id="graphic" aria-hidden="true"><span></span><span></span><span></span></div></section>
    <footer><span id="footer-label">Synthetic sample</span><nav><button id="previous" aria-label="Previous page" title="Previous page">&#8592;</button><button id="next" aria-label="Next page" title="Next page">&#8594;</button></nav></footer>
  </main>
  <script>
    const pages = [
      {title: 'First Page', heights: [35, 65, 95]},
      {title: 'Second Page', heights: [90, 30, 60]},
      {title: 'Third Page', heights: [60, 95, 25]},
      {title: 'Last Page', heights: [85, 55, 40]}
    ];
    let index = 0;
    function render() {
      const page = pages[index];
      document.getElementById('title').textContent = page.title;
      document.getElementById('number').textContent = String(index + 1).padStart(2, '0');
      document.getElementById('counter').textContent = `${index + 1} / ${pages.length}`;
      document.querySelectorAll('#graphic span').forEach((bar, i) => { bar.style.height = `${page.heights[i]}%`; });
    }
    document.getElementById('previous').addEventListener('click', () => { index = Math.max(0, index - 1); render(); });
    document.getElementById('next').addEventListener('click', () => { index = Math.min(pages.length - 1, index + 1); render(); });
    render();
  </script>
</body>
</html>
